name: RecapPrototype
options:
  bundleIdPrefix: com.recap
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

targets:
  RecapPrototype:
    type: application
    platform: iOS
    sources:
      - path: RecapPrototype
    info:
      path: RecapPrototype/Info.plist
      properties:
        CFBundleDisplayName: Recap
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.prototype
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: WTG6UTV87R
