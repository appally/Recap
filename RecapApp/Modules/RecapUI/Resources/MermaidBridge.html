<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <!-- mermaid 桥接页：离线加载 mermaid.min.js，把 Swift 注入的源码渲染成 SVG。
       安全：securityLevel=strict（转义 HTML、禁交互绑定）；不加载任何外网。
       注：JS 经 recap-local:// 自定义 scheme 由 App 进程内 handler 提供，WebContent 无需
       读 framework bundle（旧 loadFileURL 的 sandbox extension 在 jetsam/debug 压力下被拒）。 -->
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }

    /* 内联（默认）：#d 取满宽，SVG 铺满可用宽度、height 随 viewBox 等比缩放；
       !important 覆盖 mermaid useMaxWidth 注入的内联 max-width=<自然宽>px，
       否则窄图（如 TD 流程图）停在自然尺寸显小。高度由 ResizeObserver 回传。 */
    #d { width: 100%; }
    #d svg { width: 100%; max-width: 100% !important; height: auto; display: block; }

    /* 全屏：SVG 按自然固有像素尺寸渲染，大图溢出视口 -> WKWebView scrollView 可拖拽滚动 +
       pinch 缩放细看；小图由 body flex 居中（flex 在内容溢出视口时自动退化为左/顶对齐，
       左/上侧仍可达，不会卡死边缘）。
       不用 contain（#d 100%×100vh + svg max-width/height:100%）--那会把内容夹进视口，
       contentSize==bounds 无滚动空间，拖拽被 bounces 弹回；pinch 时 100% / 100vh / flex 随
       layout viewport reflow，SVG 被 max-height:100% 重新夹回，放大无效 ->「移动后马上恢复原位」。*/
    body.fullscreen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    body.fullscreen #d {
      width: auto;                 /* 覆盖内联 #d{width:100%}，收缩到 SVG 自然尺寸 */
    }
    body.fullscreen #d svg {
      width: auto !important;      /* 解除 max-width/height:100% 夹紧 + mermaid useMaxWidth 注入的满宽 */
      height: auto !important;
      max-width: none !important;
      max-height: none !important;
      display: block;
    }
  </style>
  <script src="recap-local://bundle/mermaid.min.js"></script>
</head>
<body>
  <div id="d"></div>
  <script>
    (function () {
      var counter = 0;
      var lastTheme = null;

      // 高度回传：#d 尺寸一变就通知 Swift，由 SwiftUI 重排容器。
      var ro = new ResizeObserver(function () {
        var h = document.getElementById('d').offsetHeight;
        try { window.webkit.messageHandlers.height.postMessage(h); } catch (e) {}
      });
      ro.observe(document.getElementById('d'));

      /// Swift 调用：renderMermaid(<json编码的source>, 'default'|'dark', 'inline'|'fullscreen')。
      /// mode 决定 CSS 分流：内联满宽铺满 / 全屏 contain 完整居中。
      /// 失败时不清空 #d —— 保留上一帧成功渲染（流式半截图静默消化），仅回传 error。
      window.renderMermaid = function (src, theme, mode) {
        theme = theme || 'default';
        mode = mode || 'inline';
        document.body.classList.toggle('fullscreen', mode === 'fullscreen');
        try {
          // 仅 theme 变化时 re-initialize，避免重复 initialize 警告。
          if (theme !== lastTheme) {
            mermaid.initialize({
              startOnLoad: false,
              securityLevel: 'strict',
              theme: theme,
              flowchart: { useMaxWidth: true, htmlLabels: true },
              themeVariables: {}
            });
            lastTheme = theme;
          }
          var id = 'm_' + (counter++);
          mermaid.render(id, src).then(function (res) {
            document.getElementById('d').innerHTML = res.svg;
          }).catch(function (e) {
            report(e);
          });
        } catch (e) {
          report(e);
        }
      };

      function report(e) {
        var msg = (e && (e.message || e.str)) ? String(e.message || e.str) : String(e);
        try { window.webkit.messageHandlers.error.postMessage(msg); } catch (_) {}
      }

      // 通知 Swift：mermaid.js 已就绪，可以注入源码渲染（规避 didFinish 与子资源加载的时序问题）。
      try { window.webkit.messageHandlers.ready.postMessage(true); } catch (e) {}
    })();
  </script>
</body>
</html>
