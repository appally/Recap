# RecapApp 迁移计划:本文件由 xcodegen 驱动（RecapApp/RecapApp.xcodeproj 由它生成）。
# ⚠️ regenerate 后必须执行: sh scripts/fix_scheme.sh
#    （xcodegen 不识别 PRODUCT_NAME=Recap，会把 scheme 的 BuildableName 误生成为 RecapApp.app）
name: RecapApp
options:
  bundleIdPrefix: com.recap
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  OpenAI:
    url: https://github.com/MacPaw/OpenAI.git
    exactVersion: 0.5.1
  # SpeakerKit（说话人分离）；会拉 WhisperKit 作编译依赖，但不强制下载 Whisper 模型
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.0.0
  # FluidAudio（端侧 SenseVoice/Paraformer + Silero VAD + CAM++ 声纹）；exact pin 规避 #723 版本解析问题
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: WTG6UTV87R
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # 所有 target(含 5 个 framework)继承版本号。embedded framework 的自动生成 Info.plist
    # 会据此写入 CFBundleShortVersionString/CFBundleVersion, 否则 ASC 报 90057。
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    # 自动签名：Xcode 据 DEVELOPMENT_TEAM 自动选证书。
    CODE_SIGN_STYLE: Automatic

targets:

  # ─────────────────────────────────────────────
  # Models：无依赖，SwiftData @Model + 值类型
  # ─────────────────────────────────────────────
  RecapModels:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RecapModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.models
        PRODUCT_NAME: RecapModels
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # xcodegen 会在 target 级写死 CURRENT_PROJECT_VERSION=1 覆盖 project 级版本号,
        # 显式继承让 framework 与主 App 版本号同步 bump(否则 ASC 90057 修复失效/漂移)。
        CURRENT_PROJECT_VERSION: "$(inherited)"
        MARKETING_VERSION: "$(inherited)"

  # ─────────────────────────────────────────────
  # ASR：SpeechAnalyzer + FunASR + VolcASR（备）+ AudioRecorder
  # ─────────────────────────────────────────────
  RecapASR:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RecapASR
    dependencies:
      - target: RecapModels
      - package: ArgmaxOSS
        product: SpeakerKit
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.asr
        PRODUCT_NAME: RecapASR
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # xcodegen 会在 target 级写死 CURRENT_PROJECT_VERSION=1 覆盖 project 级版本号,
        # 显式继承让 framework 与主 App 版本号同步 bump(否则 ASC 90057 修复失效/漂移)。
        CURRENT_PROJECT_VERSION: "$(inherited)"
        MARKETING_VERSION: "$(inherited)"

  # ─────────────────────────────────────────────
  # LLM：MacPaw/OpenAI + MinutesPipeline + Keychain
  # ─────────────────────────────────────────────
  RecapLLM:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RecapLLM
        excludes:
          # 内置技能 .md 以 resources 编译（plan 060），不进编译源
          - "Agent/Skills/Bundled/*.md"
      - path: Modules/RecapLLM/Agent/Skills/Bundled
        buildPhase: resources
    dependencies:
      - target: RecapModels
      - package: OpenAI
        product: OpenAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.llm
        PRODUCT_NAME: RecapLLM
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # xcodegen 会在 target 级写死 CURRENT_PROJECT_VERSION=1 覆盖 project 级版本号,
        # 显式继承让 framework 与主 App 版本号同步 bump(否则 ASC 90057 修复失效/漂移)。
        CURRENT_PROJECT_VERSION: "$(inherited)"
        MARKETING_VERSION: "$(inherited)"

  # ─────────────────────────────────────────────
  # Persistence：ModelContainer 装配
  # ─────────────────────────────────────────────
  RecapPersistence:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RecapPersistence
    dependencies:
      - target: RecapModels
      - target: RecapLLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.persistence
        PRODUCT_NAME: RecapPersistence
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # xcodegen 会在 target 级写死 CURRENT_PROJECT_VERSION=1 覆盖 project 级版本号,
        # 显式继承让 framework 与主 App 版本号同步 bump(否则 ASC 90057 修复失效/漂移)。
        CURRENT_PROJECT_VERSION: "$(inherited)"
        MARKETING_VERSION: "$(inherited)"

  # ─────────────────────────────────────────────
  # UI：DesignSystem + Views（@Model 直驱）
  # ─────────────────────────────────────────────
  RecapUI:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RecapUI
    dependencies:
      - target: RecapModels
      - target: RecapASR
      - target: RecapLLM
      - target: RecapPersistence
      - sdk: PencilKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.ui
        PRODUCT_NAME: RecapUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # xcodegen 会在 target 级写死 CURRENT_PROJECT_VERSION=1 覆盖 project 级版本号,
        # 显式继承让 framework 与主 App 版本号同步 bump(否则 ASC 90057 修复失效/漂移)。
        CURRENT_PROJECT_VERSION: "$(inherited)"
        MARKETING_VERSION: "$(inherited)"

  # ─────────────────────────────────────────────
  # App：入口 + RecordingSession + Settings
  # ─────────────────────────────────────────────
  RecapApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Recap.storekit"
          # 作为独立 folder reference 纳入（见下），避免被 App 扫描拆成单文件。
          - "speakerkit-coreml"
          - "speaker-diarization-coreml"
          - "campplus-coreml"
      # 说话人分离模型：蓝色 folder reference 整目录进 bundle，保持 .mlmodelc 目录原子性
      #（group/扫描模式会把 .mlmodelc 拆成散文件、破坏 CoreML bundle 结构）。
      # 首次冷启动命中 bundle、零网络零损坏；详见 SpeakerKitDiarizer.bundledModelFolder。
      - path: App/speakerkit-coreml
        type: folder
      # FluidDiarizer 双模型（pyannote+WeSpeaker，13.7MB，sha256 与 lfsSHA256 清单对账）：
      # 2026-08-23 hf-mirror 全站 /resolve/ 308 回源后国内运行期下载不可达，照 SpeakerKit
      # 先例随包分发；详见 FluidDiarizer.bundledModelsDirectory。
      - path: App/speaker-diarization-coreml
        type: folder
      # CAM++ 声纹双模型（CamPlusPreprocessor+CamPlusPlus，15.8MB，六项 LFS sha256 对账）：
      # 同上断源先例随包分发（声纹录入/身份匹配引擎）；详见 CampPlusEmbedderProvider.loadEmbedder。
      - path: App/campplus-coreml
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 纪要
        LSApplicationCategoryType: public.app-category.productivity
        # 用 build setting 变量,build 时 Xcode 展开(同下方 settings.base 的 MARKETING_VERSION / CURRENT_PROJECT_VERSION)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 仅用标准 HTTPS(WSS/HTTPS),属豁免加密,免每次 ASC 弹出口合规问卷。
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 用于会议录音与实时转写（含锁屏后台持续录制）
        NSCameraUsageDescription: 用于会议中拍照记录此刻（白板、想法），以及扫描纸质议程与上场纪要
        NSRemindersFullAccessUsageDescription: 用于把会议待办创建为提醒事项
        NSCalendarsFullAccessUsageDescription: 用于把会议关键节点创建为日历日程
        NSSiriUsageDescription: 用于通过 Siri / 快捷指令处理会议与待办
        NSLocationWhenInUseUsageDescription: 用于在会议开始时自动记录会议地点（仅保存在本机）
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        # UIRequiresFullScreen 已删(iOS 26 起弃用且被系统忽略, iPad 一律参与多任务窗口)。
        # 但「方向不全须全屏」校验仍生效——iPad 运行时即报 "All interface orientations
        # must be supported unless the app requires full screen."。故 iPad 补齐第 4 方向
        # (竖屏倒置), 不回加弃用 key; SwiftUI 布局对倒置竖屏自动适配, 零额外工作。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/RecapApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        # com.recap.app 已被占用，不可注册；开发期用个人唯一 ID
        PRODUCT_BUNDLE_IDENTIFIER: com.liuyong.recap
        PRODUCT_NAME: Recap
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION 已上提到 project 级 settings.base,
        # app 与各 framework 共用同一版本号(见文件顶部 settings.base)。
        # 自动签名：Xcode 据 DEVELOPMENT_TEAM 自动选证书。分级：
        #   Debug   = Apple Development(真机调试)
        #   Release = 空(不锁身份)→ 自动签名在 Archive 时选 Apple Distribution。
        # ⚠️ 不要全局锁 "Apple Development"(Archive 仍用开发证书) 也不要留 xcodegen 默认
        #    "iPhone Developer"(非标准遗留值)。
        CODE_SIGN_STYLE: Automatic
        # 使用 Icon_v3 应用图标 (1024x1024)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: RecapModels
      - target: RecapASR
      - target: RecapLLM
      - target: RecapPersistence
      - target: RecapUI
      # 控制中心/锁屏/Action Button 控件 extension（plan 049 Wave B）
      - target: RecapControls
    scheme:
      storeKitConfiguration: App/Recap.storekit
      testTargets:
        - RecapModelsTests
        - RecapLLMTests
        - RecapASRTests
        - RecapUITests

  # ─────────────────────────────────────────────
  # Controls：系统控件 extension（控制中心/锁屏/Action Button，plan 049）
  # ─────────────────────────────────────────────
  RecapControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls
        excludes:
          - "Info.plist"
      # intent 须双 target 编译：Control 的 action 类型要在 extension 内可解析，
      # 只编译进 extension 时 openAppWhenRun 失效（社区验证坑，见 plans/049 Wave B.3）。
      - path: App/Intents/StartRecordingIntent.swift
    dependencies:
      # RecapDeepLink（深链枚举）在 RecapModels，两 target 共享同一静态桥
      - target: RecapModels
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: 纪要控件
        # 版本键必须显式写变量：xcodegen 生成的 plist 若留字面量(1.0/1)，
        # target 级 $(inherited) 构建设置不会回填，appex 与主 App 版本漂移
        # 会触发 ASC ITMS-90474（CFBundleVersion Mismatch）。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuyong.recap.controls
        PRODUCT_NAME: RecapControls
        SKIP_INSTALL: YES
        # xcodegen target 级写死 CURRENT_PROJECT_VERSION=1 会覆盖 project 级版本号
        #（ASC 90057 坑，见各 framework 同款注释）——显式继承。
        CURRENT_PROJECT_VERSION: "$(inherited)"
        MARKETING_VERSION: "$(inherited)"

  # ─────────────────────────────────────────────
  # Tests
  # ─────────────────────────────────────────────
  RecapASRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RecapASRTests
    dependencies:
      - target: RecapASR
      - target: RecapModels
      - target: RecapApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.asr.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Recap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recap
        BUNDLE_LOADER: $(TEST_HOST)

  RecapModelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RecapModelsTests
    dependencies:
      - target: RecapModels
      - target: RecapApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.models.tests
        GENERATE_INFOPLIST_FILE: YES
        # App PRODUCT_NAME 是 Recap，不是 RecapApp
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Recap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recap
        BUNDLE_LOADER: $(TEST_HOST)

  RecapLLMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RecapLLMTests
    dependencies:
      - target: RecapLLM
      - target: RecapModels
      - target: RecapApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.llm.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Recap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recap
        BUNDLE_LOADER: $(TEST_HOST)

  RecapUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RecapUITests
    dependencies:
      - target: RecapUI
      - target: RecapModels
      - target: RecapApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.ui.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Recap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recap
        BUNDLE_LOADER: $(TEST_HOST)
