name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Cloud gateway (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  ios:
    name: iOS build + unit tests
    runs-on: macos-latest
    env:
      # 部署目标 iOS 26；runner 默认装最新 Xcode（含 iOS 26 SDK）。
      # ⚠️ 构建与测试都必须用「具体模拟器」（arm64-only）：generic destination 会连带编
      # x86_64 切片，而 FluidAudio 的 NemoTextProcessing.xcframework 无该切片（plan 056 实测链接失败）。
      TEST_DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Show Xcode & SDK
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -20
      - name: Resolve simulator UDID (arm64)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"
      - name: Build (simulator)
        run: |
          xcodebuild build \
            -project RecapApp/RecapApp.xcodeproj \
            -scheme RecapApp \
            -destination id=${{ steps.sim.outputs.udid }} \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests (393 cases: Models/LLM/ASR/UI)
        run: |
          xcodebuild test \
            -project RecapApp/RecapApp.xcodeproj \
            -scheme RecapApp \
            -destination id=${{ steps.sim.outputs.udid }} \
            CODE_SIGNING_ALLOWED=NO

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
