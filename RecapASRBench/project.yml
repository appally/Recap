name: RecapASRBench
options:
  bundleIdPrefix: com.recap
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

# FluidAudio 以 SPM 依赖引入（exact pin，规避 #723 版本解析问题）
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5

targets:
  RecapASRBench:
    type: application
    platform: iOS
    sources:
      - path: RecapASRBench
    info:
      path: RecapASRBench/Info.plist
      properties:
        CFBundleDisplayName: RecapASRBench
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: 用于会议录音转写评测
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.recap.bench
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: WTG6UTV87R
    dependencies:
      - package: FluidAudio
